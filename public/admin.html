<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BETMA CHALLENGE – Quản trị</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap"><link rel="stylesheet" href="style.css">
<style>
body{background:var(--card)}header{background:#fff;border-bottom:3px solid var(--red);padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:18px;font-weight:800}header h1 b{color:var(--red)}nav{display:flex;gap:4px;flex:1}nav button{border:0;background:0;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}nav button.on{background:var(--red);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:20px}.login{max-width:340px;margin:12vh auto;background:#fff;padding:28px;border-radius:14px}.login h1{margin-bottom:16px}.login input{margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.k{background:#fff;border-radius:12px;padding:16px;border-left:4px solid var(--red)}.k b{font-size:30px;display:block}.k span{color:var(--mute);font-size:13px}
.panel{background:#fff;border-radius:12px;padding:18px;margin-top:14px}.panel h3{margin-bottom:14px;font-size:16px}
.chart{display:flex;align-items:flex-end;gap:8px;height:180px}.chart div{flex:1;text-align:center;font-size:12px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}.chart i{display:block;background:var(--red);border-radius:5px 5px 0 0;min-height:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input,.tools select{width:auto;padding:9px 10px;flex:1;min-width:120px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;color:var(--mute);font-weight:600;padding:9px 8px;border-bottom:2px solid var(--line);white-space:nowrap}td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}tr.c{cursor:pointer}tr.c:hover{background:var(--card)}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--okbg);color:var(--ok)}.tag.o{background:var(--card);color:var(--mute)}
.modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;padding:16px;z-index:9}.modal.on{display:grid}.mb{background:#fff;border-radius:14px;padding:22px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
.q{display:grid;grid-template-columns:140px 1fr;gap:14px;border-bottom:1px solid var(--line);padding:14px 0}.q img{width:140px;aspect-ratio:16/10;object-fit:cover;border-radius:8px;background:var(--card)}.q .r{display:flex;gap:6px;margin-bottom:6px;align-items:center}.q .r input[type=text]{padding:7px 9px}.q .r input[type=radio]{width:auto;accent-color:var(--red)}
@media(max-width:560px){.q{grid-template-columns:1fr}.q img{width:100%}}
</style></head><body>
<div id="login" class="login" style="display:none"><h1>Đăng nhập quản trị</h1><input id="u" placeholder="Tài khoản" autocomplete="username"><input id="p" type="password" placeholder="Mật khẩu" autocomplete="current-password" onkeydown="event.key==='Enter'&&login()"><div class="err" id="le"></div><button class="btn" style="width:100%" onclick="login()">Đăng nhập</button></div>
<div id="app" style="display:none"><header><h1>BETMA <b>CHALLENGE</b> · Quản trị</h1><nav><button data-t="ov" class="on">Tổng quan</button><button data-t="pl">Người tham gia</button><button data-t="qs">Câu hỏi</button></nav><span id="who" style="color:var(--mute);font-size:13px"></span><button class="btn ghost sm" onclick="logout()">Đăng xuất</button></header>
<div class="wrap"><div id="ov"></div><div id="pl" hidden></div><div id="qs" hidden></div></div></div>
<div class="modal" id="md" onclick="if(event.target===this)this.classList.remove('on')"><div class="mb" id="mbody"></div></div>
<script>
const $=id=>document.getElementById(id);let ME=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,m='GET',b){const r=await fetch(u,{method:m,headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(r.status===401&&u!=='/api/admin/login'){boot();throw d}if(!r.ok)throw d;return d}
async function boot(){try{ME=await api('/api/admin/me');$('login').style.display='none';$('app').style.display='block';$('who').textContent=ME.user+' ('+ME.role+')';tab('ov')}catch{$('app').style.display='none';$('login').style.display='block'}}
async function login(){try{await api('/api/admin/login','POST',{username:$('u').value,password:$('p').value});$('p').value='';boot()}catch(e){$('le').textContent=e.error||'Lỗi'}}
async function logout(){await api('/api/admin/logout','POST',{});boot()}
document.querySelector('nav').onclick=e=>e.target.dataset.t&&tab(e.target.dataset.t);
function tab(t){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));['ov','pl','qs'].forEach(x=>$(x).hidden=x!==t);({ov,pl,qs})[t]()}
async function ov(){const s=await api('/api/admin/stats'),mx=Math.max(1,...s.dist);
$('ov').innerHTML=`<div class="kpis">${[['Tổng người đăng ký',s.players],['Tổng lượt chơi',s.attempts],['Hoàn thành game',s.completed],['Tỷ lệ hoàn thành',Math.round(s.rate*100)+'%'],['Điểm trung bình',s.avg.toFixed(1)],['Đạt từ 8/10',s.high]].map(([l,v])=>`<div class="k"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
<div class="panel"><h3>Phân bố điểm số</h3><div class="chart">${s.dist.map((n,i)=>`<div><span>${n}</span><i style="height:${n/mx*140}px"></i><span>${i}</span></div>`).join('')}</div></div>
<div class="panel"><h3>Tỷ lệ hoàn thành</h3><div style="height:14px;background:var(--card);border-radius:9px;overflow:hidden"><i style="display:block;height:100%;width:${s.rate*100}%;background:var(--red)"></i></div><p style="color:var(--mute);font-size:13px">${s.completed}/${s.attempts} lượt chơi đã hoàn thành</p></div>`}
let page=1;
function qsF(){const f=['q','year','from','to','min','max','status'].map(k=>[k,$('f-'+k)?.value||'']).filter(x=>x[1]);return new URLSearchParams(f).toString()}
function plShell(){if($('f-q'))return;$('pl').innerHTML=`<div class="panel"><div class="tools"><input id="f-q" placeholder="Tìm tên, SĐT, email, mã…"><select id="f-year"><option value="">Mọi năm học</option><option>Năm 1</option><option>Năm 2</option><option>Năm 3</option><option>Năm 4</option><option>Khác</option></select><input id="f-from" type="date" aria-label="Từ ngày"><input id="f-to" type="date" aria-label="Đến ngày"><input id="f-min" type="number" min="0" max="10" placeholder="Điểm từ"><input id="f-max" type="number" min="0" max="10" placeholder="Điểm đến"><select id="f-status"><option value="">Mọi trạng thái</option><option value="done">Hoàn thành</option><option value="open">Chưa hoàn thành</option></select><button class="btn sm" onclick="page=1;pl()">Lọc</button><button class="btn ghost sm" id="exp" onclick="location='/api/admin/export.csv?'+qsF()">Xuất CSV (mở được bằng Excel)</button></div><div class="tw" id="tb"></div><div id="pg" style="margin-top:12px;display:flex;gap:8px;align-items:center"></div></div>`;$('f-q').onkeydown=e=>e.key==='Enter'&&(page=1,pl())}
async function pl(){plShell();if(ME.role!=='admin')$('exp').hidden=true;const d=await api('/api/admin/attempts?'+qsF()+'&page='+page);
$('tb').innerHTML=`<table><tr>${['Mã','Họ và tên','SĐT','Email','Năm','Tham gia','Điểm','Câu đúng','Trạng thái'].map(h=>`<th>${h}</th>`).join('')}</tr>${d.rows.map(x=>`<tr class="c" onclick="detail(${x.id})"><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td>${esc(x.year)}</td><td>${esc(x.started_at)}</td><td><b>${x.score??'–'}</b></td><td>${x.score??'–'}</td><td><span class="tag ${x.done?'':'o'}">${x.done?'Hoàn thành':'Chưa xong'}</span></td></tr>`).join('')||'<tr><td colspan=9>Chưa có dữ liệu phù hợp.</td></tr>'}</table>`;
const n=Math.ceil(d.total/25)||1;$('pg').innerHTML=`<button class="btn ghost sm" ${page<=1?'disabled':''} onclick="page--;pl()">Trước</button><span>Trang ${page}/${n} · ${d.total} lượt</span><button class="btn ghost sm" ${page>=n?'disabled':''} onclick="page++;pl()">Sau</button>`}
async function detail(id){const a=await api('/api/admin/attempts/'+id);$('mbody').innerHTML=`<h3>${esc(a.name)} · ${esc(a.code)}</h3><p>${esc(a.phone)} · ${esc(a.email)} · ${esc(a.year)}<br>Điểm: <b>${a.score??'chưa hoàn thành'}</b>${a.duration_s!=null?' · '+a.duration_s+' giây':''}</p>${a.answers.map(x=>`<div class="q"><img src="${esc(x.image)}" alt=""><div><b>Câu ${x.position}: ${x.is_correct?'✓ Đúng':'✗ Sai'}</b><br>Chọn: ${'ABCD'[x.chosen]}. ${esc(x.options[x.chosen])}${x.is_correct?'':`<br>Đúng: ${'ABCD'[x.correct]}. ${esc(x.options[x.correct])}`}</div></div>`).join('')}<button class="btn sm" style="margin-top:14px" onclick="$('md').classList.remove('on')">Đóng</button>`;$('md').classList.add('on')}
async function qs(){const L=await api('/api/admin/questions'),ro=ME.role!=='admin';
$('qs').innerHTML=`<div class="panel"><h3>Câu hỏi (${L.filter(x=>x.active).length} đang bật — game dùng tối đa 10 câu theo thứ tự)</h3>${ro?'<p>Bạn chỉ có quyền xem.</p>':''}${L.map(x=>`<div class="q" data-id="${x.id}"><div><img src="${esc(x.image)}" alt=""><input type="file" accept="image/png,image/jpeg,image/webp" ${ro?'disabled':''} style="margin-top:6px;padding:6px;font-size:12px" onchange="up(this)"></div><div>${[0,1,2,3].map(i=>`<div class="r"><input type="radio" name="c${x.id}" value="${i}" ${x.correct===i?'checked':''} ${ro?'disabled':''} aria-label="Đáp án đúng"><b>${'ABCD'[i]}</b><input type="text" value="${esc(x.options[i])}" ${ro?'disabled':''}></div>`).join('')}<div class="r">Thứ tự <input type="number" value="${x.position}" style="width:70px;padding:7px" ${ro?'disabled':''}><label><input type="checkbox" ${x.active?'checked':''} ${ro?'disabled':''} style="width:auto"> Bật</label>${ro?'':'<button class="btn sm" onclick="saveQ(this)">Lưu</button>'}</div></div><input type="hidden" value="${esc(x.image)}"></div>`).join('')}${ro?'':'<button class="btn ghost sm" onclick="addQ()">+ Thêm câu hỏi</button>'}</div>`}
function up(f){const r=new FileReader();r.onload=async()=>{try{const d=await api('/api/admin/upload','POST',{dataUrl:r.result});const row=f.closest('.q');row.querySelector('img').src=d.image;row.querySelector('input[type=hidden]').value=d.image}catch(e){alert(e.error||'Lỗi tải ảnh')}};r.readAsDataURL(f.files[0])}
async function saveQ(b){const row=b.closest('.q'),t=[...row.querySelectorAll('input[type=text]')].map(x=>x.value),ck=row.querySelector('input[type=radio]:checked');
try{await api('/api/admin/questions/'+row.dataset.id,'PUT',{options:t,correct:ck?+ck.value:-1,image:row.querySelector('input[type=hidden]').value,position:+row.querySelector('input[type=number]').value,active:row.querySelector('label input').checked});b.textContent='Đã lưu ✓';setTimeout(()=>b.textContent='Lưu',1500)}catch(e){alert(e.error)}}
async function addQ(){try{await api('/api/admin/questions','POST',{image:(await(async()=>'/uploads/mau-1.svg')()),options:['Đáp án A','Đáp án B','Đáp án C','Đáp án D'],correct:0,position:99});qs()}catch(e){alert(e.error)}}
boot();
</script></body></html>
